- name: MetalLB
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Ensure mode is set
      ansible.builtin.assert:
        that:
          - mode is defined
          - mode in ["install", "uninstall"]
        quiet: true
        fail_msg: "Mode must be set to 'install' or 'uninstall'."

    - name: Install MetalLB
      ansible.builtin.import_role:
        name: metallb
        tasks_from: install
      when: mode == "install"

    - name: Uninstall MetalLB
      ansible.builtin.import_role:
        name: metallb
        tasks_from: uninstall
      when: mode == "uninstall"
