- name: Node exporter
  hosts: localhost
  tasks:
    - name: Ensure mode is set
      assert:
        that:
          - mode is defined
          - mode in ["install", "uninstall"]
        fail_msg: "Mode must be set to 'install' or 'uninstall'."

    - name: Install Node Exporter
      import_role:
        name: node_exporter
        tasks_from: install
      when: mode == "install"

    - name: Uninstall Node Exporter
      import_role:
        name: node_exporter
        tasks_from: uninstall
      when: mode == "uninstall"