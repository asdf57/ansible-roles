---
# Dedicated trust rollout: this playbook never partitions or reinstalls a host.
- name: Reconcile SSH management trust on installed hosts
  hosts: all
  gather_facts: true
  become: true
  remote_user: ansible
  vars:
    ansible_ssh_common_args: '-o HostKeyAlias={{ host_key_alias | default(inventory_hostname) }}'
  roles:
    - management
  post_tasks:
    - name: Reconnect using the resulting SSH trust policy
      ansible.builtin.meta: reset_connection
    - name: Verify certificate-authenticated management access
      ansible.builtin.ping:
