- name: API provision setup
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Set up servers in API
      include_role:
        name: provision
        tasks_from: create_server
      tags:
        - setup

- name: Infrastructure setup
  hosts: all
  gather_facts: false
  tasks:
    - name: General
      include_role:
        name: provision
        tasks_from: init_server
      tags:
        - setup

- name: Pre-provision setup
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Check if /var/lib/is_live_env exists
      ansible.builtin.stat:
        path: /var/lib/is_live_env
      register: is_live_env_file

    - name: Set live environment fact
      ansible.builtin.set_fact:
        is_live_env: "{{ is_live_env_file.stat.exists }}"

    - name: Enter live environment
      when: not is_live_env | bool
      include_role:
        name: provision
        tasks_from: reboot
      vars:
        reboot_to_ipxe: true

    - name: Await and refresh
      include_role:
        name: provision
        tasks_from: await_and_refresh

    - name: Check if /var/lib/is_live_env exists
      ansible.builtin.stat:
        path: /var/lib/is_live_env
      register: is_live_env_file

    - name: Set live environment fact
      ansible.builtin.set_fact:
        is_live_env: "{{ is_live_env_file.stat.exists }}"

    - name: Fail if not in the live environment
      ansible.builtin.fail:
        msg: "Failed to enter live environment."
      when: not is_live_env | bool

    - name: Require separate daemon enrollment before destructive provisioning
      ansible.builtin.stat:
        path: /etc/homelabd/environment
      register: agent_enrollment
      when: management_access_enabled | default(true) | bool

    - name: Refuse provisioning without the daemon identity to preserve
      ansible.builtin.assert:
        that: agent_enrollment.stat.exists and agent_enrollment.stat.isreg and agent_enrollment.stat.uid == 0 and agent_enrollment.stat.mode == '0600'
        fail_msg: Enroll the live daemon with its restricted API token before provisioning.
      when: management_access_enabled | default(true) | bool

    - name: Read the separately enrolled daemon identity
      ansible.builtin.slurp:
        src: /etc/homelabd/environment
      register: enrolled_agent_environment
      no_log: true
      when: management_access_enabled | default(true) | bool

    - name: Refuse provisioning with an empty or short daemon token
      ansible.builtin.assert:
        that:
          - (enrolled_agent_environment.content | b64decode) is search('(?m)^API_TOKEN=\S{32,}$')
        fail_msg: Enroll the live daemon with its restricted API token before provisioning.
      no_log: true
      when: management_access_enabled | default(true) | bool

- name: Provision
  hosts: all
  become: true
  tasks:
    - name: Perform prereqs
      include_role:
        name: provision
        tasks_from: prereqs

    - name: Wipe the disk
      include_role:
        name: provision
        tasks_from: wipe
      when: should_wipe | bool | default(false)

    - name: Setup the disk
      include_role:
        name: provision
        tasks_from: partition

    - name: Bootstrap setup
      include_role:
        name: provision
        tasks_from: bootstrap

- name: Await server
  hosts: all
  gather_facts: false
  tasks:
    - name: Await and refresh
      include_role:
        name: provision
        tasks_from: await_and_refresh

- name: Post-provision setup
  hosts: all
  gather_facts: true
  tasks:
    - name: Post-provision setup
      include_role:
        name: provision
        tasks_from: post_provision
