---
- name: Execute one operator-owned provisioning stage
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Require an explicit supported stage and pinned attempt
      ansible.builtin.assert:
        that:
          - provision_stage in ['prime', 'arm', 'clear', 'install', 'post', 'refresh-prepare', 'refresh-boot', 'refresh-clear', 'reboot']
          - provision_attempt_id is defined
          - provision_server_uid is defined
    - name: Prime the boot NIC
      ansible.builtin.include_role:
        name: provision
        tasks_from: prime_nic
      when: provision_stage == 'prime'
    - name: Arm the one-shot netboot entry
      ansible.builtin.include_role:
        name: grub
        tasks_from: reboot_to_ipxe
      when: provision_stage == 'arm'
    - name: Clear pending netboot selection
      ansible.builtin.command:
        argv: [grub-editenv, /boot/grub/grubenv, unset, next_entry]
      when: provision_stage == 'clear'
    - name: Run guarded installation
      ansible.builtin.include_role:
        name: provision
        tasks_from: install
      when: provision_stage == 'install'
    - name: Prepare the pinned live bootstrap without changing disks
      ansible.builtin.include_role:
        name: provision
        tasks_from: refresh_live
      when: provision_stage == 'refresh-prepare'
    - name: Require the prepared kexec image before live bootstrap
      ansible.builtin.command:
        argv: [cat, /sys/kernel/kexec_loaded]
      register: prepared_kexec
      changed_when: false
      when: provision_stage in ['refresh-boot', 'refresh-clear']
    - name: Unload the owned pending live bootstrap kernel during preparation cleanup
      ansible.builtin.command:
        argv: [kexec, --unload]
      when: provision_stage == 'refresh-clear' and prepared_kexec.stdout == '1'
    - name: Verify no kexec selection remains after cleanup
      ansible.builtin.command:
        argv: [cat, /sys/kernel/kexec_loaded]
      register: cleared_kexec
      changed_when: false
      when: provision_stage == 'refresh-clear'
    - name: Refuse to release an uncleared bootstrap selection
      ansible.builtin.assert:
        that: cleared_kexec.stdout == '0'
      when: provision_stage == 'refresh-clear'
    - name: Refuse an unprepared live bootstrap
      ansible.builtin.assert:
        that: prepared_kexec.stdout == '1'
      when: provision_stage == 'refresh-boot'
    - name: Request the checkpointed reboot through systemd
      ansible.builtin.command:
        argv: [systemctl, "{{ 'kexec' if provision_stage == 'refresh-boot' else 'reboot' }}"]
      async: 30
      poll: 0
      when: provision_stage in ['refresh-boot', 'reboot']
    - name: Apply installed-system packages
      ansible.builtin.package:
        name: "{{ provision_server_spec.packages | default([]) }}"
        state: present
      when: provision_stage == 'post' and (provision_server_spec.packages | default([]) | length > 0)
    - name: Apply configured sysctls after installed boot
      ansible.builtin.command:
        argv: [sysctl, --system]
      when: provision_stage == 'post' and (provision_server_spec.sysctls | default({}) | length > 0)
