---
- name: Reconcile Grafana in the selected Kubernetes cluster
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    # Captured inventory enables SSH/become for nodes, not the runner.
    ansible_become: false
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    grafana_values: "{{ configuration_values | default({}) }}"
  tasks:
    - name: Install or upgrade Grafana atomically
      ansible.builtin.import_role:
        name: grafana
        tasks_from: install
