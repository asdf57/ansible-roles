- name: Flannel-first boot gate
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Ensure mode is set
      ansible.builtin.assert:
        that:
          - mode is defined
          - mode in ["install", "uninstall"]
        quiet: true
        fail_msg: "Mode must be set to 'install' or 'uninstall'."

    - name: Install the gate
      ansible.builtin.import_role:
        name: flannel_first
        tasks_from: install
      when: mode == "install"

    - name: Uninstall the gate
      ansible.builtin.import_role:
        name: flannel_first
        tasks_from: uninstall
      when: mode == "uninstall"
