---
- name: Build and publish provisioning images
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load the published platform configuration
      ansible.builtin.import_role:
        name: init
        tasks_from: load_inventory

    - name: Build and publish provisioning images
      ansible.builtin.import_role:
        name: init
        tasks_from: publish_images
