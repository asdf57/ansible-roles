# Experiment only; see README.md. Never referenced by provisioning or Configurations.
- name: Release leaked host-local IP reservations (experiment)
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Ensure mode is set
      ansible.builtin.assert:
        that:
          - mode is defined
          - mode == "run"
        quiet: true
        fail_msg: "Only mode=run exists."

    - name: Remove reservations whose sandbox no longer exists
      ansible.builtin.shell: |
        set -eu
        sandboxes=$(crictl pods -q --no-trunc)
        kept=0; removed=0
        for f in /var/lib/cni/networks/*/*; do
          [ -f "$f" ] || continue
          case "$(basename "$f")" in last_reserved_ip*|lock) continue ;; esac
          id=$(head -n 1 "$f")
          if [ -n "$id" ] && printf '%s\n' "$sandboxes" | grep -qx "$id"; then kept=$((kept + 1))
          else rm -f "$f"; removed=$((removed + 1)); fi
        done
        echo "kept=$kept removed=$removed"
      args:
        executable: /bin/bash
      register: ipam_gc
      changed_when: "'removed=0' not in ipam_gc.stdout"

    - name: Report
      ansible.builtin.debug:
        msg: "{{ ipam_gc.stdout }}"
