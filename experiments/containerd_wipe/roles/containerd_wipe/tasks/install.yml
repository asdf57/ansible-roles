---
- name: Install the boot-time units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [homelab-containerd-wipe.service, homelab-flannel-prefetch.service]

- name: Enable the units for the next boot without running them now
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    enabled: "{{ item.enabled }}"
    daemon_reload: true
  loop:
    - {name: homelab-containerd-wipe.service, enabled: true}
    - {name: homelab-flannel-prefetch.service, enabled: "{{ containerd_wipe_prefetch | bool }}"}
  loop_control:
    label: "{{ item.name }}"
