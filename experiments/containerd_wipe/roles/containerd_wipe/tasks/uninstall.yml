---
- name: Inspect the boot-time units
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop: [homelab-containerd-wipe.service, homelab-flannel-prefetch.service]
  register: containerd_wipe_units

- name: Disable the boot-time units
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    enabled: false
  loop: "{{ containerd_wipe_units.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Remove the boot-time units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop: [homelab-containerd-wipe.service, homelab-flannel-prefetch.service]

- name: Forget the removed units
  ansible.builtin.systemd_service:
    daemon_reload: true
