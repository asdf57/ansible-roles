---
# Script variant under test (a file in this role's files/):
#   flannel-first       freeze kube-proxy; v1/v2, lock back-off, restart handling
#   flannel-first-min   freeze kube-proxy only, minimal (cgroup v1 or v2)
#   flannel-first-dels  also freeze the thick Multus daemon (holds back CNI DELs)
#   flannel-first-kill  stand-in for the prod script: kill non-flanneld iptables processes
flannel_first_script: flannel-first
# Set for variants that use jq (e.g. operator-provided scripts copied in locally).
flannel_first_needs_jq: false
# systemd stops the gate after this; scripts that run longer (the prod guard
# runs up to 3600s) need a larger value.
flannel_first_runtime_max_seconds: 300
