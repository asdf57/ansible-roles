---
# Operator-provided variants (kept out of git) may need jq.
- name: Install jq for script variants that need it
  ansible.builtin.package:
    name: jq
    state: present
  when: flannel_first_needs_jq | bool

- name: Install the boot-time kube-proxy gate
  ansible.builtin.copy:
    src: "{{ flannel_first_script }}"
    dest: /usr/local/sbin/flannel-first
    owner: root
    group: root
    mode: '0755'

- name: Install the gate's systemd unit
  ansible.builtin.template:
    src: flannel-first.service.j2
    dest: /etc/systemd/system/flannel-first.service
    owner: root
    group: root
    mode: '0644'
  register: flannel_first_unit

- name: Enable the gate for the next boot without running it now
  ansible.builtin.systemd_service:
    name: flannel-first.service
    enabled: true
    daemon_reload: "{{ flannel_first_unit.changed }}"
