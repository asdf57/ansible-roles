---
# The upstream 50Mi limit can OOM the thick daemon while many pods are created
# or torn down at once (for example after a node reboot).
# Reach the API through the verified context's endpoint rather than the
# kubernetes ClusterIP, which exists only after kube-proxy programs the node.
multus_direct_api_endpoint: true

multus_values:
  resources:
    requests: {cpu: 100m, memory: 50Mi}
    limits: {cpu: 500m, memory: 300Mi}
