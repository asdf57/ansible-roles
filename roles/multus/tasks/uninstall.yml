---
- name: Use the verified context's API endpoint for the Multus daemon
  ansible.builtin.set_fact:
    multus_api_server: "{{ (lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'KUBECONFIG')) | from_yaml).clusters[0].cluster.server | ansible.builtin.urlsplit if multus_direct_api_endpoint | bool else {'hostname': '', 'port': ''} }}"

# Removing the DaemonSet alone leaves 00-multus.conf on every node, and new pod
# sandboxes then fail against the absent daemon. Roll daemons that delete their
# generated configuration on exit before removing the release.
- name: Roll Multus daemons that remove their host configuration on exit
  kubernetes.core.helm:
    name: multus
    chart_ref: "{{ role_path }}/helm"
    kubeconfig: "{{ lookup('ansible.builtin.env', 'KUBECONFIG') }}"
    release_namespace: kube-system
    state: present
    atomic: true
    wait: true
    timeout: 5m
    values: "{{ multus_values | combine({'cleanupConfigOnExit': true, 'apiServer': {'host': multus_api_server.hostname, 'port': multus_api_server.port | string}}) }}"

- name: Uninstall Multus
  kubernetes.core.helm:
    name: multus
    kubeconfig: "{{ lookup('ansible.builtin.env', 'KUBECONFIG') }}"
    release_namespace: kube-system
    state: absent
    wait: true
    timeout: 5m
