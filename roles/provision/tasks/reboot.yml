---
- name: Require an operator-owned boot transition
  ansible.builtin.assert:
    quiet: true
    that: provision_attempt_id is defined

- name: Prime the selected NIC
  ansible.builtin.include_tasks: prime_nic.yml
  when: reboot_to_ipxe | default(false) | bool

- name: Arm the stable one-shot GRUB entry
  ansible.builtin.include_role:
    name: grub
    tasks_from: reboot_to_ipxe
  when: reboot_to_ipxe | default(false) | bool

- name: Request a normal reboot without a sysrq fallback
  ansible.builtin.command:
    argv: [systemctl, reboot]
  async: 30
  poll: 0
