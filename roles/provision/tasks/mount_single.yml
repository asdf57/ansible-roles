---
- name: Create the pinned mount directory
  ansible.builtin.file:
    path: "/mnt{{ '' if item.mountPoint == '/' else item.mountPoint }}"
    state: directory
  when: item.role != 'swap'

- name: Mount the pinned filesystem
  ansible.posix.mount:
    src: "{{ partition_prefix }}{{ item.number }}"
    path: "/mnt{{ '' if item.mountPoint == '/' else item.mountPoint }}"
    fstype: "{{ item.filesystem }}"
    opts: defaults
    state: mounted
    fstab: /tmp/homelab-provision-mounts
  when: item.role != 'swap'
