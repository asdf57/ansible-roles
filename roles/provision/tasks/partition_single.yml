---
- name: Create the pinned partition geometry
  ansible.builtin.command:
    argv:
      - sgdisk
      - "--new={{ item.number }}:{{ item.startMiB * 1048576 // partition_sector_bytes }}:{{ item.endMiB * 1048576 // partition_sector_bytes - 1 }}"
      - "--typecode={{ item.number }}:{{ {'efi': 'EF00', 'swap': '8200', 'root': '8300', 'data': '8300'}[item.role] }}"
      - "--change-name={{ item.number }}:homelab-{{ item.role }}-{{ item.number }}"
      - "{{ disk_name }}"
