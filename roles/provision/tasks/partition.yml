---
- name: Require the operator-approved physical disk
  ansible.builtin.assert:
    quiet: true
    that: disk_name is defined and partition_prefix is defined

- name: Create the pinned partitions
  ansible.builtin.include_tasks: partition_single.yml
  loop: "{{ storage.partitions }}"
  loop_control:
    label: "{{ item.number }}"

- name: Wait for partition device discovery
  ansible.builtin.command: udevadm settle
  changed_when: false

- name: Create the pinned filesystems
  ansible.builtin.include_tasks: initfs_single.yml
  loop: "{{ storage.partitions }}"
  loop_control:
    label: "{{ item.number }}"

- name: Verify the completed storage against the pinned plan
  ansible.builtin.include_tasks: verify_storage.yml
