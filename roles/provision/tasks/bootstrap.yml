---
- name: Mount the new root
  ansible.builtin.include_tasks: mount_general_partitions.yml

- name: Initialize the Arch package trust
  ansible.builtin.command:
    argv: [pacman-key, "{{ item }}"]
  loop: [--init, --populate]
  when: provision_operating_system.distribution == 'arch'

- name: Install the Arch base system from desired OS, not live-host facts
  ansible.builtin.command:
    argv: [pacstrap, -K, /mnt, base, linux, linux-firmware, python, openssh, sudo, lldpd, networkmanager, grub, efibootmgr, dosfstools, ethtool]
  when: provision_operating_system.distribution == 'arch'

- name: Install the requested Debian release
  ansible.builtin.command:
    argv: [debootstrap, --include=ca-certificates, "{{ provision_operating_system.version }}", /mnt, https://deb.debian.org/debian/]
  when: provision_operating_system.distribution == 'debian'

- name: Mount EFI and swap
  ansible.builtin.include_tasks: mount_non_general_partitions.yml

- name: Create chroot mount directories
  ansible.builtin.file:
    path: "/mnt/{{ item }}"
    state: directory
  loop: [dev, proc, sys, run]

- name: Bind the live kernel filesystems into the new root
  ansible.posix.mount:
    src: "/{{ item }}"
    path: "/mnt/{{ item }}"
    state: mounted
    opts: bind
    fstype: none
  loop: [dev, proc, sys, run]

- name: Bind UEFI variable access for GRUB installation
  ansible.posix.mount:
    src: /sys/firmware/efi/efivars
    path: /mnt/sys/firmware/efi/efivars
    state: mounted
    opts: bind
    fstype: none

- name: Provide DNS inside the chroot
  ansible.builtin.copy:
    src: /etc/resolv.conf
    dest: /mnt/etc/resolv.conf
    remote_src: true

- name: Install Debian management and boot packages
  ansible.builtin.command:
    argv: [chroot, /mnt, apt-get, install, -y, linux-image-amd64, python3, openssh-server, sudo, lldpd, network-manager, grub-efi-amd64, efibootmgr, dosfstools, locales, ethtool]
  environment: {DEBIAN_FRONTEND: noninteractive}
  when: provision_operating_system.distribution == 'debian'

- name: Configure the installed system and complete its boot contract
  ansible.builtin.include_tasks: configure_installed.yml
