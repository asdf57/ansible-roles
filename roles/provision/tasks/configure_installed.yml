---
- name: Configure desired installed sysctls
  ansible.builtin.copy:
    dest: /mnt/etc/sysctl.d/90-homelab.conf
    mode: '0644'
    content: |
      # Managed by the homelab provisioning operator.
      {% for key, value in (provision_server_spec.sysctls | default({})).items() %}
      {{ key }} = {{ value }}
      {% endfor %}

- name: Write the installed hostname
  ansible.builtin.copy:
    content: "{{ provision_server_spec.hostName | default(inventory_hostname) }}\n"
    dest: /mnt/etc/hostname
    mode: '0644'

- name: Write installed network hosts
  ansible.builtin.copy:
    content: |
      127.0.0.1 localhost
      ::1 localhost
      127.0.1.1 {{ provision_server_spec.hostName | default(inventory_hostname) }}
    dest: /mnt/etc/hosts
    mode: '0644'

- name: Enable the requested locale
  ansible.builtin.lineinfile:
    path: /mnt/etc/locale.gen
    regexp: '^#?en_US.UTF-8 UTF-8'
    line: en_US.UTF-8 UTF-8
    create: true

- name: Generate installed locales
  ansible.builtin.command:
    argv: [chroot, /mnt, locale-gen]

- name: Configure installed locale and timezone
  ansible.builtin.copy:
    content: "LANG=en_US.UTF-8\n"
    dest: /mnt/etc/locale.conf

- name: Set installed timezone
  ansible.builtin.command:
    argv: [chroot, /mnt, ln, -sf, "/usr/share/zoneinfo/{{ provision_operating_system.timezone | default('UTC') }}", /etc/localtime]

- name: Lock root password access
  ansible.builtin.command:
    argv: [chroot, /mnt, passwd, -l, root]

- name: Install the verified managed identity, account reconciler and daemon
  ansible.builtin.include_role:
    name: management
  vars:
    management_target_root: /mnt

- name: Configure requested ordinary users without generating new credentials
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/configure_users.py"
    executable: python3
  environment:
    PROVISION_USERS: "{{ provision_users | to_json }}"
    PROVISION_GROUPS: "{{ provision_server_spec.groups | default([]) | to_json }}"
  no_log: true

- name: Enable installed management and network services
  ansible.builtin.command:
    argv: [chroot, /mnt, systemctl, enable, "{{ item }}"]
  loop:
    - "{{ 'ssh' if provision_operating_system.distribution == 'debian' else 'sshd' }}"
    - lldpd
    - NetworkManager

- name: Generate an installed-only fstab
  ansible.builtin.shell: |
    set -eu
    root_uuid=$(blkid -s UUID -o value {{ (partition_prefix + '3') | quote }})
    efi_uuid=$(blkid -s UUID -o value {{ (partition_prefix + '1') | quote }})
    swap_uuid=$(blkid -s UUID -o value {{ (partition_prefix + '2') | quote }})
    printf 'UUID=%s / ext4 defaults 0 1\nUUID=%s /boot/efi vfat defaults 0 2\nUUID=%s none swap sw 0 0\n' "$root_uuid" "$efi_uuid" "$swap_uuid" > /mnt/etc/fstab

- name: Install GRUB in the new EFI partition and register the normal firmware path
  ansible.builtin.command:
    argv: [chroot, /mnt, grub-install, --target=x86_64-efi, --efi-directory=/boot/efi, --bootloader-id=Homelab, --recheck]

- name: Install the common one-shot iPXE boot contract
  ansible.builtin.include_role:
    name: grub
  vars:
    chroot_path: /mnt

- name: Inspect the registered firmware boot path
  ansible.builtin.command:
    argv: [efibootmgr, -v]
  register: installed_efi_entries
  changed_when: false

- name: Read the new EFI partition identity
  ansible.builtin.command:
    argv: [blkid, -s, PARTUUID, -o, value, "{{ partition_prefix }}1"]
  register: installed_efi_uuid
  changed_when: false

- name: Require firmware default boot to select the new partition's GRUB
  ansible.builtin.include_tasks: reconcile_efi.yml

- name: Verify the reconciled firmware default boot path
  ansible.builtin.command:
    argv: [python3, '-', "{{ installed_efi_uuid.stdout }}"]
    stdin: "{{ lookup('file', role_path + '/files/verify_efi.py') }}"
  changed_when: false

- name: Read the new root filesystem identity
  ansible.builtin.command:
    argv: [blkid, -s, UUID, -o, value, "{{ partition_prefix }}3"]
  register: installed_root_uuid
  changed_when: false

- name: Create the protected installation marker directory
  ansible.builtin.file:
    path: /mnt/var/lib/homelab
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Write the installation checkpoint before the final reboot
  ansible.builtin.copy:
    dest: /mnt/var/lib/homelab/provisioning.json
    owner: root
    group: root
    mode: '0600'
    content: "{{ {'serverUID': provision_server_uid, 'attemptID': provision_attempt_id, 'reprovision': provision_request_counter | int, 'planDigest': provision_plan_digest, 'rootUUID': installed_root_uuid.stdout, 'efiPARTUUID': installed_efi_uuid.stdout, 'bootloader': '/EFI/Homelab/grubx64.efi', 'distribution': provision_operating_system.distribution} | to_nice_json }}"

- name: Unmount chroot bind mounts without ignoring failures
  ansible.posix.mount:
    path: "{{ item }}"
    state: unmounted
  loop: [/mnt/sys/firmware/efi/efivars, /mnt/run, /mnt/sys, /mnt/proc, /mnt/dev]

- name: Flush the completed installation
  ansible.builtin.command: sync
