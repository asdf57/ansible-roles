---
- name: Inspect staging mounts on the explicitly selected disk
  ansible.builtin.command:
    argv: [python3, '-', "{{ provision_target_disk }}"]
    stdin: "{{ lookup('file', role_path + '/files/probe.py') }}"
  register: staging_probe
  changed_when: false

- name: Require the owned independent live session before staging cleanup
  ansible.builtin.assert:
    that:
      - provision_attempt_id == provision_run_uid
      - provision_target_disk is match('^/dev/disk/by-id/[^/]+$')
      - (staging_probe.stdout | from_json).live
      - not (staging_probe.stdout | from_json).rootOnTarget
      - (staging_probe.stdout | from_json).bootID == provision_cleanup_boot_id
      - (staging_probe.stdout | from_json).liveBuildID == provision_cleanup_build_id
      - (staging_probe.stdout | from_json).disk == provision_disk_identity
      - (staging_probe.stdout | from_json).cleanupMounts is not none

- name: Unmount only verified installation staging mounts deepest first
  ansible.builtin.command:
    argv: [umount, --, "{{ item }}"]
  loop: "{{ (staging_probe.stdout | from_json).cleanupMounts | default([], true) }}"

- name: Reinspect after ordinary unmounts
  ansible.builtin.command:
    argv: [python3, '-', "{{ provision_target_disk }}"]
    stdin: "{{ lookup('file', role_path + '/files/probe.py') }}"
  register: cleaned_probe
  changed_when: false

- name: Require the same session and fully unmounted approved disk
  ansible.builtin.assert:
    that:
      - not (cleaned_probe.stdout | from_json).mounted
      - (cleaned_probe.stdout | from_json).bootID == provision_cleanup_boot_id
      - (cleaned_probe.stdout | from_json).disk == provision_disk_identity
