---
- name: Install Grafana
  kubernetes.core.helm:
    name: grafana
    chart_ref: "{{ role_path }}/helm"
    kubeconfig: "{{ lookup('ansible.builtin.env', 'KUBECONFIG') }}"
    release_namespace: grafana
    create_namespace: true
    state: present
    atomic: true
    wait: true
    timeout: 5m
    values: "{{ grafana_values }}"
