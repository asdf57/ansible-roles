---
- name: Resolve the Server's desired management trust
  when: ssh_ca_bundle is not defined
  block:
    - name: Read the Server through the runner's authorized API identity
      ansible.builtin.uri:
        url: "{{ lookup('env', 'STIGMERGY_API_URL') }}/api/v1alpha1/servers/{{ inventory_hostname | urlencode }}"
        headers: "{{ {'Authorization': 'Bearer ' + lookup('env', 'STIGMERGY_API_TOKEN')} if lookup('env', 'STIGMERGY_API_TOKEN') else {} }}"
        return_content: true
        validate_certs: true
      delegate_to: localhost
      become: false
      register: management_server
      no_log: true

    - name: Require the Server's desired trust to be resolved
      ansible.builtin.assert:
        that:
          - management_server.json.spec.sshCertificateAuthorityRef is defined
          - management_server.json.status.desiredSSHTrustBundleDigest is defined
          - management_server.json.status.sshTrust.publicBundle is defined

    - name: Use the Server's public trust for management installation
      ansible.builtin.set_fact:
        ssh_ca_bundle: "{{ management_server.json.status.sshTrust.publicBundle }}"
        ssh_ca_bundle_digest: "{{ management_server.json.status.desiredSSHTrustBundleDigest }}"

- name: Require resolved public trust and the shared homelabd assets
  ansible.builtin.assert:
    that:
      - ssh_ca_bundle is defined
      - ssh_ca_bundle | length > 0
      - ssh_ca_bundle_digest is defined
      - ('sha256:' + (ssh_ca_bundle | hash('sha256'))) == ssh_ca_bundle_digest
      - management_target_root in ['/', '/mnt']
    fail_msg: Management installation requires resolved CA trust and HOMELABD_SETUP_SOURCE.

- name: Stage the shared management setup assets
  ansible.builtin.tempfile:
    state: directory
    prefix: homelabd-management.
    path: "{{ '/mnt/var/tmp' if management_target_root == '/mnt' else '/var/tmp' }}"
  register: management_stage
  become: true

- name: Install management access
  become: true
  block:
    - name: Copy the homelabd setup tree
      ansible.builtin.copy:
        src: "{{ homelabd_setup_source }}/"
        dest: "{{ management_stage.path }}/setup/"
        owner: root
        group: root
        mode: preserve
      when: homelabd_setup_source | length > 0

    - name: Reuse setup assets from the live or installed host
      ansible.builtin.copy:
        src: /usr/share/homelabd/setup/
        dest: "{{ management_stage.path }}/setup/"
        remote_src: true
        owner: root
        group: root
        mode: preserve
      when: homelabd_setup_source | length == 0

    - name: Stage the validated public trust bundle
      ansible.builtin.copy:
        content: "{{ ssh_ca_bundle }}"
        dest: "{{ management_stage.path }}/ssh-user-ca.pub"
        owner: root
        group: root
        mode: '0644'

    - name: Install the shared reconciler, policy and offline-enabled units
      ansible.builtin.command:
        argv:
          - /bin/bash
          - "{{ management_stage.path }}/setup/management/install.sh"
          - "{{ management_target_root }}"
          - "{{ management_stage.path }}/ssh-user-ca.pub"

    - name: Stage the running image's daemon binary for the installed OS
      ansible.builtin.copy:
        src: /usr/local/bin/homelabd
        dest: "{{ management_stage.path }}/homelabd"
        remote_src: true
        owner: root
        group: root
        mode: '0755'
      when: management_target_root == '/mnt'

    - name: Install the same daemon into the installed OS
      ansible.builtin.command:
        argv:
          - /bin/bash
          - "{{ management_stage.path }}/setup/agent/install.sh"
          - /mnt
          - "{{ management_stage.path }}/homelabd"
          - "{{ lookup('env', 'STIGMERGY_API_URL') }}"
      when: management_target_root == '/mnt'

    - name: Create the installed daemon configuration directory
      ansible.builtin.file:
        path: /mnt/etc/homelabd
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: management_target_root == '/mnt'

    - name: Read managed host identity when public bundle was supplied separately
      ansible.builtin.uri:
        url: "{{ lookup('env', 'STIGMERGY_API_URL') }}/api/v1alpha1/servers/{{ inventory_hostname | urlencode }}"
        headers:
          Authorization: "Bearer {{ lookup('env', 'STIGMERGY_API_TOKEN') }}"
        return_content: true
        validate_certs: true
      delegate_to: localhost
      become: false
      register: provisioning_host_identity
      when: management_target_root == '/mnt'
      no_log: true

    - name: Require the managed host identity before installed-system provisioning
      ansible.builtin.assert:
        that:
          - provisioning_host_identity.json.status.hostSSH.phase == 'Ready'
          - provisioning_host_identity.json.status.hostSSH.installedKeyPairRef == provisioning_host_identity.json.status.hostSSH.keyPairRef
          - provisioning_host_identity.json.status.hostSSH.installedFingerprint == provisioning_host_identity.json.status.hostSSH.fingerprint
      when: management_target_root == '/mnt'

    - name: Derive the live host identity before preserving it to disk
      ansible.builtin.command: ssh-keygen -y -f /etc/ssh/ssh_host_ed25519_key
      register: provisioning_live_host_public_key
      changed_when: false
      when: management_target_root == '/mnt'
      no_log: true

    - name: Require the live identity to match the API-managed public key
      ansible.builtin.assert:
        that: provisioning_live_host_public_key.stdout.split()[:2] | join(' ') == provisioning_host_identity.json.status.hostSSH.publicKey.split()[:2] | join(' ')
      when: management_target_root == '/mnt'

    - name: Find the already verified live SSH host identity
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: 'ssh_host_*_key*'
        file_type: file
      register: management_host_keys
      when: management_target_root == '/mnt'
      no_log: true

    - name: Preserve verified host keys across the first installed-system reboot
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "/mnt/etc/ssh/{{ item.path | basename }}"
        remote_src: true
        owner: root
        group: root
        mode: "{{ '0644' if item.path.endswith('.pub') else '0600' }}"
      loop: "{{ management_host_keys.files | default([]) }}"
      when: management_target_root == '/mnt'
      no_log: true

    - name: Ensure the installed sshd serves the same managed host identity
      ansible.builtin.lineinfile:
        path: /mnt/etc/ssh/sshd_config
        line: HostKey /etc/ssh/ssh_host_ed25519_key
        insertbefore: BOF
      when: management_target_root == '/mnt'

    - name: Preserve the separately enrolled daemon identity in the installed OS
      ansible.builtin.copy:
        src: /etc/homelabd/environment
        dest: /mnt/etc/homelabd/environment
        remote_src: true
        owner: root
        group: root
        mode: '0600'
      when: management_target_root == '/mnt'
      no_log: true

    - name: Reconcile the installed-system account before reboot
      ansible.builtin.command:
        argv: [chroot, /mnt, /usr/local/libexec/ensure-ansible-user]
      when: management_target_root == '/mnt'

    - name: Reconcile the running-system account immediately
      ansible.builtin.command: /usr/local/libexec/ensure-ansible-user
      when: management_target_root == '/'

    - name: Validate installed-system SSH configuration
      ansible.builtin.command:
        argv: [chroot, /mnt, /usr/sbin/sshd, -t]
      when: management_target_root == '/mnt' and (provision_operating_system.distribution | default(ansible_distribution | lower)) == 'debian'

    - name: Validate installed-system SSH configuration on Arch
      ansible.builtin.command:
        argv: [chroot, /mnt, /usr/bin/sshd, -t]
      when: management_target_root == '/mnt' and (provision_operating_system.distribution | default(ansible_distribution | lower)) in ['arch', 'archlinux']

    - name: Validate running SSH configuration
      ansible.builtin.command: sshd -t
      when: management_target_root == '/'

    - name: Enable running account reconciliation
      ansible.builtin.systemd_service:
        name: ansible-account.timer
        enabled: true
        state: started
        daemon_reload: true
      when: management_target_root == '/'

    - name: Reload running SSH after configuration validation
      ansible.builtin.systemd_service:
        name: "{{ 'ssh' if ansible_distribution == 'Debian' else 'sshd' }}"
        state: reloaded
      when: management_target_root == '/'

  always:
    - name: Remove the exact management staging directory
      ansible.builtin.file:
        path: "{{ management_stage.path }}"
        state: absent

- name: Verify installed trust content
  become: true
  ansible.builtin.stat:
    path: "{{ management_target_root.rstrip('/') }}/etc/ssh/homelab-user-ca.pub"
    checksum_algorithm: sha256
  register: installed_management_bundle

- name: Require the installed trust digest to match desired trust
  ansible.builtin.assert:
    that: "('sha256:' + installed_management_bundle.stat.checksum) == ssh_ca_bundle_digest"

- name: Expose installed trust as a playbook result
  ansible.builtin.set_fact:
    installed_ssh_ca_bundle_digest: "{{ ssh_ca_bundle_digest }}"
