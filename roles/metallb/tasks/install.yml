---
- name: Install MetalLB
  kubernetes.core.helm:
    name: metallb
    chart_ref: "{{ role_path }}/helm"
    kubeconfig: "{{ lookup('ansible.builtin.env', 'KUBECONFIG') }}"
    release_namespace: metallb-system
    create_namespace: true
    state: present
    atomic: true
    wait: true
    timeout: 5m
    values: "{{ metallb_values }}"
