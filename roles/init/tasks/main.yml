---
# Stigmergy API, OpenBao, nginx, Concourse, registry, and network bootstrap

- name: Ensure the inventory group vars exist
  ansible.builtin.stat:
    path: "/homelab/inventory/group_vars/all.yaml"
  register: inventory_group_vars

- name: Fail when the inventory group vars are missing
  ansible.builtin.fail:
    msg: "Expected group vars at /homelab/inventory/group_vars/all.yaml."
  when: not inventory_group_vars.stat.exists

- name: Load the inventory group vars
  ansible.builtin.include_vars:
    file: "/homelab/inventory/group_vars/all.yaml"

- name: Ensure the mounted data path is provided
  ansible.builtin.assert:
    that:
      - lookup('env', 'MOUNT_DATA_PATH') | length > 0
      - lookup('env', 'STIGMERGY_API_URL') | length > 0
    fail_msg: "MOUNT_DATA_PATH and STIGMERGY_API_URL must be provided to the bootstrap container."

- name: Configure the mounted data path
  ansible.builtin.set_fact:
    mounted_data_path: "{{ lookup('env', 'MOUNT_DATA_PATH') }}"

- name: Template the docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ mounted_data_path }}/docker-compose.yml"

- name: Clone the Stigmergy controller repo
  ansible.builtin.git:
    repo: "{{ git_stigmergy_repo }}"
    dest: "{{ mounted_data_path }}/stigmergy"
    version: "{{ git_stigmergy_branch }}"
    force: true

- name: Clone the webhook repo
  ansible.builtin.git:
    repo: "{{ git_webhook_repo }}"
    dest: "{{ mounted_data_path }}/webhook"
    version: "{{ git_webhook_branch }}"
    force: true

- name: Create acme directory
  file:
    path: "{{ mounted_data_path }}/acme"
    state: directory

- name: Copy acme Dockerfile
  copy:
    src: acme/Dockerfile
    dest: "{{ mounted_data_path }}/acme/Dockerfile"

- name: Copy acme entrypoint.sh
  copy:
    src: acme/entrypoint.sh
    dest: "{{ mounted_data_path }}/acme/entrypoint.sh"
    mode: "0755"

- name: Create concourse directory
  file:
    path: "{{ mounted_data_path }}/concourse"
    state: directory

- name: Copy concourse Dockerfile
  copy:
    src: concourse/Dockerfile
    dest: "{{ mounted_data_path }}/concourse/Dockerfile"

- name: Copy concourse entrypoint.sh
  copy:
    src: concourse/entrypoint.sh
    dest: "{{ mounted_data_path }}/concourse/entrypoint.sh"
    mode: "0755"

- name: Create dnsmasq directory
  file:
    path: "{{ mounted_data_path }}/dnsmasq"
    state: directory

- name: Copy dnsmasq Dockerfile
  copy:
    src: dnsmasq/Dockerfile
    dest: "{{ mounted_data_path }}/dnsmasq/Dockerfile"

- name: Template dnsmasq.conf
  template:
    src: dnsmasq.conf.j2
    dest: "{{ mounted_data_path }}/dnsmasq/dnsmasq.conf"

- name: Create nginx directory
  file:
    path: "{{ mounted_data_path }}/nginx"
    state: directory

- name: Copy nginx Dockerfile
  copy:
    src: nginx/Dockerfile
    dest: "{{ mounted_data_path }}/nginx/Dockerfile"

- name: Copy nginx entrypoint.sh
  copy:
    src: nginx/entrypoint.sh
    dest: "{{ mounted_data_path }}/nginx/entrypoint.sh"
    mode: "0755"

- name: Create the files directory
  ansible.builtin.file:
    path: "{{ mounted_data_path }}/nginx/files"
    state: directory

- name: Copy nginx boot.ipxe
  copy:
    src: nginx/boot.ipxe
    dest: "{{ mounted_data_path }}/nginx/files/boot.ipxe"

- name: Copy nginx arch boot iPXE script
  copy:
    src: nginx/arch_boot.ipxe
    dest: "{{ mounted_data_path }}/nginx/files/arch_boot.ipxe"

- name: Copy nginx debian boot iPXE script
  copy:
    src: nginx/debian_boot.ipxe
    dest: "{{ mounted_data_path }}/nginx/files/debian_boot.ipxe"

- name: Template nginx.conf
  template:
    src: default.conf.j2
    dest: "{{ mounted_data_path }}/nginx/default.conf"

- name: Create OpenBao directory
  file:
    path: "{{ mounted_data_path }}/openbao"
    state: directory

- name: Copy OpenBao configuration
  copy:
    src: "openbao/{{ item.name }}"
    dest: "{{ mounted_data_path }}/openbao/{{ item.name }}"
    mode: "{{ item.mode }}"
  loop:
    - name: openbao.hcl
      mode: "0644"
    - name: openbao-agent.hcl
      mode: "0644"
    - name: openbao-api-policy.hcl
      mode: "0644"
    - name: openbao-bootstrap.sh
      mode: "0755"
    - name: concourse-policy.hcl
      mode: "0644"

- name: Create registry directory
  file:
    path: "{{ mounted_data_path }}/registry"
    state: directory

- name: Create registry config directory
  file:
    path: "{{ mounted_data_path }}/registry/config"
    state: directory

- name: Template the registry config
  template:
    src: config.yml.j2
    dest: "{{ mounted_data_path }}/registry/config/config.yml"

- name: Download iPXE efi binary
  ansible.builtin.get_url:
    url: https://boot.ipxe.org/x86_64-efi/ipxe.efi
    dest: "{{ mounted_data_path }}/nginx/files/ipxe.efi"

- name: Download iPXE iso
  ansible.builtin.get_url:
    url: https://boot.ipxe.org/ipxe.iso
    dest: "{{ mounted_data_path }}/nginx/files/ipxe.iso"

- name: Load kernel modules required for Concourse worker networking
  become: true
  ansible.builtin.command:
    cmd: "modprobe {{ item }}"
  loop: "{{ concourse_worker_kernel_modules }}"
  changed_when: false

- name: Delete the ipvlan network
  community.docker.docker_network:
    name: ipvlan
    state: absent
  ignore_errors: yes

- name: Build the docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ mounted_data_path }}"
    project_name: infra
    state: present
    build: always
    check_files_existing: false
    remove_orphans: yes
  register: docker_compose_result
  failed_when: docker_compose_result.failed
  ignore_errors: true
  retries: 5
  delay: 5

- name: Print Docker Compose error
  debug:
    msg: "{{ docker_compose_result.stderr | default('No error message available') }}"
  when: docker_compose_result.failed

- name: Fail if Docker Compose failed after retries
  fail:
    msg: "Docker Compose failed to start the services after multiple attempts."
  when: docker_compose_result is failed

- name: Wait for the acme.sh container to become healthy
  shell: "{% raw %}docker inspect --format='{{.State.Health.Status}}' acme{% endraw %}"
  register: acme_health
  until: acme_health.stdout == "healthy"
  retries: 1000

- name: macvlan shim
  when: network_driver == "macvlan" and ansible_os_family not in ["Darwin", "Windows"]
  block:
    - name: Is the macvlan network already created?
      ansible.builtin.command: ip link show macvlan-shim
      register: macvlan_check
      ignore_errors: true

    - name: Create macvlan shim (linux only)
      ansible.builtin.shell: |
        nsenter --target 1 --net --mount ip link add macvlan-shim link {{ ansible_default_ipv4.interface }} type macvlan mode bridge
        nsenter --target 1 --net --mount ip addr add {{ macvlan_host_ip }} dev macvlan-shim
        nsenter --target 1 --net --mount ip link set macvlan-shim up
        nsenter --target 1 --net --mount ip route add {{ macvlan_subnet }} dev macvlan-shim || true
      when: macvlan_check.rc != 0
      become: true

- name: Wait for the OpenBao API to become reachable
  ansible.builtin.uri:
    url: "{{ openbao_bootstrap_url }}/v1/sys/health"
    method: GET
    status_code:
      - 200
      - 429
      - 472
      - 473
      - 501
      - 503
    validate_certs: false
  register: openbao_health
  retries: 60
  delay: 2
  until: openbao_health is succeeded

# - name: Create git id25519 SSH key
#   community.crypto.openssh_keypair:
#     path: "{{ git_ssh_key_path }}"
#     type: "ed25519"

# - name: Create provisioning id25519 SSH key
#   community.crypto.openssh_keypair:
#     path: "{{ provisioning_ssh_key_path }}"
#     type: "ed25519"

- name: Wait for the Stigmergy API to become reachable
  ansible.builtin.uri:
    url: "{{ lookup('env', 'STIGMERGY_API_URL') }}/readyz"
    method: GET
    status_code: 200
  register: stigmergy_api
  retries: 30
  delay: 3
  until: stigmergy_api is succeeded

- name: Create or update the OpenBao SecretStore resource
  ansible.builtin.uri:
    url: "{{ lookup('env', 'STIGMERGY_API_URL') }}/api/v1alpha1/secret-stores/openbao"
    method: PUT
    body_format: json
    status_code:
      - 200
      - 201
    body:
      apiVersion: homelab.io/v1alpha1
      kind: SecretStore
      metadata:
        name: openbao
      spec:
        provider:
          openBao:
            address: http://127.0.0.1:8200
            kvV2Mount: kv2
            keyPrefix: secrets
            authentication:
              tokenFile: /run/openbao/token

- name: Define the bootstrap Secret resources
  ansible.builtin.set_fact:
    bootstrap_secrets:
      - name: primary-router-api-password
        path: router/primary/api_password
        value: "{{ lookup('env', 'PRIMARY_ROUTER_API_PASSWORD') }}"
      - name: github-webhook-secret
        path: github/webhook
        value: "{{ lookup('env', 'GITHUB_WEBHOOK_SECRET') }}"
      - name: concourse-password
        path: concourse/local_user/password
        value: "{{ lookup('env', 'CONCOURSE_PASSWORD') }}"
      - name: concourse-oauth-client-secret
        path: concourse/oauth/client_secret
        value: "{{ lookup('env', 'CONCOURSE_OAUTH_CLIENT_SECRET') }}"
      - name: cloudflare-api-key
        path: cloudflare/api_key
        value: "{{ lookup('env', 'CLOUDFLARE_API_KEY') }}"
      - name: zerossl-eab-kid
        path: zerossl/eab/kid
        value: "{{ lookup('env', 'ZEROSSL_EAB_KID') }}"
      - name: zerossl-eab-hmac-key
        path: zerossl/eab/hmac_key
        value: "{{ lookup('env', 'ZEROSSL_EAB_HMAC_KEY') }}"
      - name: postgres-password
        path: postgres/osdb/password
        value: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
  no_log: true

- name: Ensure every bootstrap secret has a value
  ansible.builtin.assert:
    that:
      - item.value | length > 0
    fail_msg: "The value for bootstrap Secret/{{ item.name }} is empty."
  loop: "{{ bootstrap_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Create or update the bootstrap Secret resources
  ansible.builtin.uri:
    url: "{{ lookup('env', 'STIGMERGY_API_URL') }}/api/v1alpha1/secrets/{{ item.name }}"
    method: PUT
    body_format: json
    status_code:
      - 200
      - 201
    body:
      apiVersion: homelab.io/v1alpha1
      kind: Secret
      metadata:
        name: "{{ item.name }}"
      spec:
        secretStoreRef:
          name: openbao
        path: "{{ item.path }}"
        data:
          key: "{{ item.value }}"
  loop: "{{ bootstrap_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Configure the bootstrap inventory capture group
  ansible.builtin.set_fact:
    bootstrap_inventory_capture_group:
      apiVersion: homelab.io/v1alpha1
      kind: InventoryCaptureGroup
      metadata:
        name: servers
      spec:
        selector:
          matchKinds:
            - apiVersion: homelab.io/v1alpha1
              kind: Server

- name: Create or update the bootstrap inventory capture group
  ansible.builtin.uri:
    url: "{{ lookup('env', 'STIGMERGY_API_URL') }}/api/v1alpha1/inventory-capture-groups/servers"
    method: PUT
    body_format: json
    status_code:
      - 200
      - 201
    body: "{{ bootstrap_inventory_capture_group }}"

# - name: Build ISOs
#   include_tasks: build_isos.yml

- name: Show OpenBao URL
  debug:
    var: openbao_url

- name: Push the prov image to the registry
  ansible.builtin.shell:
    cmd: |
      skopeo copy --dest-tls-verify=false docker-daemon:prov:latest docker://{{ registry_ipv4 }}:5000/prov:latest
  register: prov_push
  retries: 5
  delay: 5

- name: Build the Arch ISO task image
  ansible.builtin.shell:
    cmd: |
      docker build --no-cache -t prov-iso-task-arch:latest -f /homelab/ansible/roles/os/files/arch/Dockerfile.task /homelab/ansible/roles/os/files
  register: arch_iso_task_image_build
  retries: 3
  delay: 5

- name: Push the Arch ISO task image to the registry
  ansible.builtin.shell:
    cmd: |
      skopeo copy --dest-tls-verify=false docker-daemon:prov-iso-task-arch:latest docker://{{ registry_ipv4 }}:5000/prov-iso-task-arch:latest
  register: arch_iso_task_image_push
  retries: 5
  delay: 5

- name: Build the Debian Trixie ISO task image
  ansible.builtin.shell:
    cmd: |
      docker build --no-cache -t prov-iso-task-debian-trixie:latest -f /homelab/ansible/roles/os/files/debian-trixie/Dockerfile.task /homelab/ansible/roles/os/files
  register: debian_iso_task_image_build
  retries: 3
  delay: 5

- name: Push the Debian Trixie ISO task image to the registry
  ansible.builtin.shell:
    cmd: |
      skopeo copy --dest-tls-verify=false docker-daemon:prov-iso-task-debian-trixie:latest docker://{{ registry_ipv4 }}:5000/prov-iso-task-debian-trixie:latest
  register: debian_iso_task_image_push
  retries: 5
  delay: 5

- name: Fetch the inventory capture groups from Stigmergy
  ansible.builtin.uri:
    url: "{{ lookup('env', 'STIGMERGY_API_URL') }}/api/v1alpha1/inventory-capture-groups"
    method: GET
    status_code: 200
  register: inventory_capture_groups

- name: Extract the inventory capture group names
  ansible.builtin.set_fact:
    inventory_capture_group_names: "{{ inventory_capture_groups.json['items'] | map(attribute='metadata.name') | list }}"

- name: Show the inventory capture group names
  debug:
    var: inventory_capture_group_names

- name: Create the inventory capture group standup pipelines
  include_tasks: create_inventory_capture_group_pipeline.yml
