---
- name: Require the registry address
  ansible.builtin.assert:
    that: registry_ipv4 | default('') | length > 0
    fail_msg: registry_ipv4 is required to publish provisioning images.

- name: Require the operator image name
  ansible.builtin.assert:
    that: lookup('env', 'HOMELAB_IMAGE') | length > 0
    fail_msg: HOMELAB_IMAGE must be provided by homelabc.

- name: Publish the Arch provisioner image
  ansible.builtin.command:
    cmd: >-
      skopeo copy --dest-tls-verify=false docker-daemon:{{ lookup('env', 'HOMELAB_IMAGE') }}
      docker://{{ registry_ipv4 }}:5000/arch-provisioner:latest
  register: arch_provisioner_push
  retries: 5
  delay: 5
  until: arch_provisioner_push is succeeded
