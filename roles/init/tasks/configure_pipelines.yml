---
- name: Require pipeline configuration
  ansible.builtin.assert:
    that:
      - lookup('env', 'STIGMERGY_API_URL') | length > 0
      - concourse_target | default('') | length > 0
    fail_msg: STIGMERGY_API_URL and concourse_target are required.

- name: Fetch published inventories from Stigmergy
  ansible.builtin.uri:
    url: "{{ lookup('env', 'STIGMERGY_API_URL') }}/api/v1alpha1/inventory-publications"
    method: GET
    status_code: 200
  register: inventory_publications

- name: Log in to Concourse
  ansible.builtin.import_role:
    name: concourse
    tasks_from: fly_login

- name: Configure one pipeline per published inventory
  ansible.builtin.include_tasks: configure_publication_pipeline.yml
  loop: "{{ inventory_publications.json['items'] }}"
  loop_control:
    loop_var: inventory_publication
    label: "{{ inventory_publication.metadata.name }}"
