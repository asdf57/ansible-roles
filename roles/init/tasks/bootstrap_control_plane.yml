---
- name: Validate control-plane bootstrap environment
  ansible.builtin.assert:
    that:
      - lookup('env', item) | length > 0
    fail_msg: "{{ item }} must be provided to the bootstrap container."
  loop:
    - MOUNT_DATA_PATH
    - STIGMERGY_API_URL
    - GIT_STIGMERGY_REPO
    - GIT_STIGMERGY_REF
    - INVENTORY_CAPTURE_GROUP
    - PRIMARY_ROUTER_NAME
    - PRIMARY_ROUTER_API_USERNAME
    - PRIMARY_ROUTER_API_PASSWORD

- name: Configure bootstrap paths
  ansible.builtin.set_fact:
    mounted_data_path: "{{ lookup('env', 'MOUNT_DATA_PATH') }}"

- name: Clone Stigmergy for the bootstrap control plane
  ansible.builtin.git:
    repo: "{{ lookup('env', 'GIT_STIGMERGY_REPO') }}"
    dest: "{{ mounted_data_path }}/stigmergy"
    version: "{{ lookup('env', 'GIT_STIGMERGY_REF') }}"
    force: true

- name: Create the OpenBao configuration directory
  ansible.builtin.file:
    path: "{{ mounted_data_path }}/openbao"
    state: directory

- name: Copy the OpenBao control-plane configuration
  ansible.builtin.copy:
    src: "openbao/{{ item.name }}"
    dest: "{{ mounted_data_path }}/openbao/{{ item.name }}"
    mode: "{{ item.mode }}"
  loop:
    - {name: openbao.hcl, mode: "0644"}
    - {name: openbao-agent.hcl, mode: "0644"}
    - {name: openbao-api-policy.hcl, mode: "0644"}
    - {name: openbao-bootstrap.sh, mode: "0755"}
    - {name: concourse-policy.hcl, mode: "0644"}

- name: Render the bootstrap control-plane Compose file
  ansible.builtin.template:
    src: docker-compose.bootstrap.yml.j2
    dest: "{{ mounted_data_path }}/docker-compose.bootstrap.yml"

- name: Start the bootstrap control plane
  community.docker.docker_compose_v2:
    project_src: "{{ mounted_data_path }}"
    project_name: infra
    files:
      - docker-compose.bootstrap.yml
    state: present
    build: always
    remove_orphans: false

- name: Wait for OpenBao to become reachable
  ansible.builtin.uri:
    url: http://127.0.0.1:8200/v1/sys/health
    method: GET
    status_code: [200, 429, 472, 473, 501, 503]
  register: openbao_health
  retries: 60
  delay: 2
  until: openbao_health is succeeded

- name: Wait for Stigmergy to become ready
  ansible.builtin.uri:
    url: "{{ lookup('env', 'STIGMERGY_API_URL') }}/readyz"
    method: GET
    status_code: 200
  register: stigmergy_api
  retries: 60
  delay: 2
  until: stigmergy_api is succeeded

- name: Create or update the OpenBao SecretStore
  ansible.builtin.uri:
    url: "{{ lookup('env', 'STIGMERGY_API_URL') }}/api/v1alpha1/secret-stores/openbao"
    method: PUT
    body_format: json
    status_code: [200, 201]
    body:
      apiVersion: homelab.io/v1alpha1
      kind: SecretStore
      metadata: {name: openbao}
      spec:
        provider:
          openBao:
            address: http://openbao:8200
            kvV2Mount: kv2
            keyPrefix: secrets
            authentication:
              tokenFile: /run/openbao/token

- name: Define environment-backed Secret resources
  ansible.builtin.set_fact:
    bootstrap_secrets:
      - {name: github-webhook-secret, path: github/webhook, value: "{{ lookup('env', 'GITHUB_WEBHOOK_SECRET') }}"}
  no_log: true

- name: Create or update the primary Router credential
  ansible.builtin.uri:
    url: "{{ lookup('env', 'STIGMERGY_API_URL') }}/api/v1alpha1/username-password-credentials/{{ lookup('env', 'PRIMARY_ROUTER_NAME') }}-credentials"
    method: PUT
    body_format: json
    status_code: [200, 201]
    body:
      apiVersion: homelab.io/v1alpha1
      kind: UsernamePasswordCredential
      metadata:
        name: "{{ lookup('env', 'PRIMARY_ROUTER_NAME') }}-credentials"
      spec:
        username: "{{ lookup('env', 'PRIMARY_ROUTER_API_USERNAME') }}"
        password: "{{ lookup('env', 'PRIMARY_ROUTER_API_PASSWORD') }}"
        secretStoreRef:
          name: openbao
        path: "router/{{ lookup('env', 'PRIMARY_ROUTER_NAME') }}/credentials"
  no_log: true

- name: Require every environment-backed secret
  ansible.builtin.assert:
    that: item.value | length > 0
    fail_msg: "The value for bootstrap Secret/{{ item.name }} is empty."
  loop: "{{ bootstrap_secrets }}"
  loop_control: {label: "{{ item.name }}"}
  no_log: true

- name: Create or update environment-backed Secret resources
  ansible.builtin.uri:
    url: "{{ lookup('env', 'STIGMERGY_API_URL') }}/api/v1alpha1/secrets/{{ item.name }}"
    method: PUT
    body_format: json
    status_code: [200, 201]
    body:
      apiVersion: homelab.io/v1alpha1
      kind: Secret
      metadata: {name: "{{ item.name }}"}
      spec:
        secretStoreRef: {name: openbao}
        path: "{{ item.path }}"
        data: {key: "{{ item.value }}"}
  loop: "{{ bootstrap_secrets }}"
  loop_control: {label: "{{ item.name }}"}
  no_log: true

- name: Wait for the primary Router credential to become ready
  ansible.builtin.uri:
    url: "{{ lookup('env', 'STIGMERGY_API_URL') }}/api/v1alpha1/username-password-credentials/{{ lookup('env', 'PRIMARY_ROUTER_NAME') }}-credentials"
    method: GET
    status_code: 200
  register: primary_router_credential
  retries: 60
  delay: 2
  until: primary_router_credential.json.status.phase | default('') == 'Ready'
  no_log: true

- name: Resolve the homelab-init source
  ansible.builtin.set_fact:
    homelab_init_repo: >-
      {{ lookup('env', 'GIT_HOMELAB_INIT_REPO')
         | default('https://github.com/asdf57/homelab-init.git', true) }}
    homelab_init_ref: >-
      {{ lookup('env', 'GIT_HOMELAB_INIT_REF') | default('main', true) }}

- name: Clone the static Stigmergy configuration
  ansible.builtin.git:
    repo: "{{ homelab_init_repo }}"
    dest: "{{ mounted_data_path }}/homelab-init"
    version: "{{ homelab_init_ref }}"
    force: true

- name: Apply the static Stigmergy configuration
  ansible.builtin.command:
    cmd: ./upload.sh
    chdir: "{{ mounted_data_path }}/homelab-init"
  environment:
    STIGMERGY_API_URL: "{{ lookup('env', 'STIGMERGY_API_URL') }}"
  register: homelab_init_upload
  changed_when: "'Applying ' in homelab_init_upload.stdout"
