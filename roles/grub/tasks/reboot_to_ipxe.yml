---
- name: Arm netboot for the next GRUB boot only
  ansible.builtin.command:
    argv: [grub-reboot, homelab-netboot]

- name: Read back the one-shot selection
  ansible.builtin.command:
    argv: [grub-editenv, /boot/grub/grubenv, list]
  register: armed_grub
  changed_when: false

- name: Require a successful one-shot selection before rebooting
  ansible.builtin.assert:
    that: "'next_entry=homelab-netboot' in armed_grub.stdout_lines"
